name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
  contracts:
    runs-on: ubuntu-latest
    container: mysten/sui-tools:testnet-v1.67.1
    steps:
      - uses: actions/checkout@v4
      - run: sui move test --path contracts/inkblob
